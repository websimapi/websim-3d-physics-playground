<html>
<head>
  <title>3D Physics Playground</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stats.js@0.17.0/build/stats.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { width: 100%; height: 100%; }
    canvas { cursor: grab; }
    canvas:active { cursor: grabbing; }
    #controls {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.7);
      padding: 15px;
      border-radius: 8px;
      color: white;
    }
    button {
      background: #2196F3;
      border: none;
      padding: 8px 15px;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover { background: #1976D2; }
    select {
      background: #333;
      border: 1px solid #555;
      color: white;
      padding: 4px;
      margin: 5px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="controls">
    <select id="shapeType">
      <option value="sphere">Sphere</option>
      <option value="box">Box</option>
      <option value="cylinder">Cylinder</option>
      <option value="cone">Cone</option>
      <option value="pyramid">Pyramid</option>
    </select>
    <select id="materialType">
      <option value="normal">Normal</option>
      <option value="bouncy">Bouncy</option>
      <option value="slippery">Slippery</option>
      <option value="heavy">Heavy</option>
    </select>
    <button onclick="addObject()">Add Object</button>
    <button onclick="addDominoes()">Dominoes</button>
    <button onclick="addStack()">Stack</button>
    <button onclick="addChain()">Chain</button>
    <button onclick="resetScene()">Reset</button>
  </div>

  <script>let camera, scene, renderer, world;
let physicsBodies = [];
let meshes = [];
let stats;
let constraints = [];
let dragConstraint = null;
let selectedBody = null;
let targetBody = null;
let dragPlane = null;
function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({
    antialias: true
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);
  world = new CANNON.World();
  world.gravity.set(0, -9.82, 0);
  world.solver.iterations = 10;
  world.defaultContactMaterial.friction = 0.3;
  world.defaultContactMaterial.restitution = 0.5;
  const ambientLight = new THREE.AmbientLight(0x404040);
  scene.add(ambientLight);
  const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
  directionalLight.position.set(10, 15, 10);
  scene.add(directionalLight);
  camera.position.set(0, 5, 15);
  camera.lookAt(0, 0, 0);
  addGround();
  stats = new Stats();
  document.body.appendChild(stats.dom);
  window.addEventListener('resize', onWindowResize, false);
  renderer.domElement.addEventListener('mousedown', onPointerDown);
  renderer.domElement.addEventListener('mousemove', onPointerMove);
  renderer.domElement.addEventListener('mouseup', onPointerUp);
  renderer.domElement.addEventListener('touchstart', onPointerDown);
  renderer.domElement.addEventListener('touchmove', onPointerMove);
  renderer.domElement.addEventListener('touchend', onPointerUp);
}
function addGround() {
  const groundGeometry = new THREE.PlaneGeometry(20, 20);
  const groundMaterial = new THREE.MeshPhongMaterial({
    color: 0x444444
  });
  const groundMesh = new THREE.Mesh(groundGeometry, groundMaterial);
  groundMesh.rotation.x = -Math.PI / 2;
  scene.add(groundMesh);
  const groundShape = new CANNON.Plane();
  const groundBody = new CANNON.Body({
    mass: 0
  });
  groundBody.addShape(groundShape);
  groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
  world.addBody(groundBody);
}
function createPhysicsMaterial(type) {
  const material = new CANNON.Material();
  switch (type) {
    case 'bouncy':
      material.restitution = 0.9;
      material.friction = 0.1;
      break;
    case 'slippery':
      material.restitution = 0.2;
      material.friction = 0.05;
      break;
    case 'heavy':
      material.restitution = 0.3;
      material.friction = 0.6;
      break;
    default:
      material.restitution = 0.3;
      material.friction = 0.3;
  }
  return material;
}
function addObject() {
  const shapeType = document.getElementById('shapeType').value;
  const materialType = document.getElementById('materialType').value;
  const color = new THREE.Color(Math.random() * 0xffffff);
  const physicsMaterial = createPhysicsMaterial(materialType);
  const mass = materialType === 'heavy' ? 5 : 1;
  let mesh, body;
  const pos = new CANNON.Vec3(Math.random() * 4 - 2, 10, Math.random() * 4 - 2);
  switch (shapeType) {
    case 'sphere':
      const radius = 0.8;
      mesh = new THREE.Mesh(new THREE.SphereGeometry(radius), new THREE.MeshPhongMaterial({
        color
      }));
      body = new CANNON.Body({
        mass,
        material: physicsMaterial
      });
      body.addShape(new CANNON.Sphere(radius));
      break;
    case 'box':
      const size = 1;
      mesh = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), new THREE.MeshPhongMaterial({
        color
      }));
      body = new CANNON.Body({
        mass,
        material: physicsMaterial
      });
      body.addShape(new CANNON.Box(new CANNON.Vec3(size / 2, size / 2, size / 2)));
      break;
    case 'cylinder':
      const radiusC = 0.6,
        height = 1.5;
      mesh = new THREE.Mesh(new THREE.CylinderGeometry(radiusC, radiusC, height, 16), new THREE.MeshPhongMaterial({
        color
      }));
      body = new CANNON.Body({
        mass,
        material: physicsMaterial
      });
      body.addShape(new CANNON.Cylinder(radiusC, radiusC, height, 16));
      body.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
      break;
    case 'cone':
      const radiusCo = 0.8,
        heightCo = 1.5;
      mesh = new THREE.Mesh(new THREE.ConeGeometry(radiusCo, heightCo, 16), new THREE.MeshPhongMaterial({
        color
      }));
      body = new CANNON.Body({
        mass,
        material: physicsMaterial
      });
      body.addShape(new CANNON.Cone(radiusCo, heightCo, 16));
      body.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
      break;
    case 'pyramid':
      mesh = new THREE.Mesh(new THREE.ConeGeometry(0.8, 1.5, 4), new THREE.MeshPhongMaterial({
        color
      }));
      const vertices = [new CANNON.Vec3(-0.8, 0, -0.8), new CANNON.Vec3(0.8, 0, -0.8), new CANNON.Vec3(0.8, 0, 0.8), new CANNON.Vec3(-0.8, 0, 0.8), new CANNON.Vec3(0, 1.5, 0)];
      const faces = [[0, 4, 1], [1, 4, 2], [2, 4, 3], [3, 4, 0], [0, 1, 2, 3]];
      body = new CANNON.Body({
        mass,
        material: physicsMaterial
      });
      body.addShape(new CANNON.ConvexPolyhedron(vertices, faces));
      break;
  }
  body.position.copy(pos);
  scene.add(mesh);
  world.addBody(body);
  meshes.push(mesh);
  physicsBodies.push(body);
}
function addDominoes() {
  const count = 12;
  const spacing = 1.8;
  for (let i = 0; i < count; i++) {
    const x = (i - count / 2) * spacing;
    const geometry = new THREE.BoxGeometry(0.3, 2, 0.8);
    const material = new THREE.MeshPhongMaterial({
      color: 0xFFD700
    });
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);
    const body = new CANNON.Body({
      mass: 1
    });
    body.addShape(new CANNON.Box(new CANNON.Vec3(0.15, 1, 0.4)));
    body.position.set(x, 1, 0);
    body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), Math.PI / 2);
    world.addBody(body);
    meshes.push(mesh);
    physicsBodies.push(body);
  }
}
function addStack() {
  const layers = 8;
  for (let i = 0; i < layers; i++) {
    const y = i * 1.1 + 0.5;
    const geometry = new THREE.BoxGeometry(1.5, 1, 1.5);
    const material = new THREE.MeshPhongMaterial({
      color: 0x00FF00
    });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(0, y, 0);
    scene.add(mesh);
    const body = new CANNON.Body({
      mass: 1
    });
    body.addShape(new CANNON.Box(new CANNON.Vec3(0.75, 0.5, 0.75)));
    body.position.set(0, y, 0);
    world.addBody(body);
    meshes.push(mesh);
    physicsBodies.push(body);
  }
}
function addChain() {
  const length = 15;
  let prevBody = null;
  for (let i = 0; i < length; i++) {
    const y = 15 - i * 1.2;
    const geometry = new THREE.SphereGeometry(0.3);
    const material = new THREE.MeshPhongMaterial({
      color: 0xFF0000
    });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(0, y, 0);
    scene.add(mesh);
    const body = new CANNON.Body({
      mass: i === 0 ? 0 : 1
    });
    body.addShape(new CANNON.Sphere(0.3));
    body.position.set(0, y, 0);
    world.addBody(body);
    if (prevBody) {
      const constraint = new CANNON.DistanceConstraint(prevBody, body, 1);
      world.addConstraint(constraint);
      constraints.push(constraint);
    }
    meshes.push(mesh);
    physicsBodies.push(body);
    prevBody = body;
  }
}
function resetScene() {
  meshes.forEach(mesh => scene.remove(mesh));
  physicsBodies.forEach(body => world.remove(body));
  constraints.forEach(c => world.removeConstraint(c));
  meshes = [];
  physicsBodies = [];
  constraints = [];
}
function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
function animate() {
  requestAnimationFrame(animate);
  stats.update();
  world.step(1 / 60);
  for (let i = 0; i < meshes.length; i++) {
    meshes[i].position.copy(physicsBodies[i].position);
    meshes[i].quaternion.copy(physicsBodies[i].quaternion);
  }
  renderer.render(scene, camera);
}
function onPointerDown(event) {
  event.preventDefault();
  const rect = renderer.domElement.getBoundingClientRect();
  const clientX = event.touches ? event.touches[0].clientX : event.clientX;
  const clientY = event.touches ? event.touches[0].clientY : event.clientY;
  const mouse = new THREE.Vector2((clientX - rect.left) / rect.width * 2 - 1, -((clientY - rect.top) / rect.height) * 2 + 1);
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(meshes);
  if (intersects.length > 0) {
    const mesh = intersects[0].object;
    selectedBody = physicsBodies[meshes.indexOf(mesh)];
    const hitPoint = new CANNON.Vec3().copy(intersects[0].point);
    const normal = new THREE.Vector3();
    camera.getWorldDirection(normal);
    dragPlane = new THREE.Plane();
    dragPlane.setFromNormalAndCoplanarPoint(normal, intersects[0].point);
    targetBody = new CANNON.Body({
      mass: 0
    });
    targetBody.addShape(new CANNON.Sphere(0.1));
    targetBody.position.copy(hitPoint);
    world.addBody(targetBody);
    const localAnchor = selectedBody.pointToLocalFrame(hitPoint);
    dragConstraint = new CANNON.PointToPointConstraint(selectedBody, localAnchor, targetBody, new CANNON.Vec3(0, 0, 0));
    world.addConstraint(dragConstraint);
    constraints.push(dragConstraint);
  }
}
function onPointerMove(event) {
  if (!selectedBody || !targetBody) return;
  event.preventDefault();
  const rect = renderer.domElement.getBoundingClientRect();
  const clientX = event.touches ? event.touches[0].clientX : event.clientX;
  const clientY = event.touches ? event.touches[0].clientY : event.clientY;
  const mouse = new THREE.Vector2((clientX - rect.left) / rect.width * 2 - 1, -((clientY - rect.top) / rect.height) * 2 + 1);
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(mouse, camera);
  const intersection = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(dragPlane, intersection)) {
    targetBody.position.set(intersection.x, intersection.y, intersection.z);
    targetBody.velocity.set(0, 0, 0);
    targetBody.angularVelocity.set(0, 0, 0);
  }
}
function onPointerUp(event) {
  event.preventDefault();
  if (dragConstraint) {
    world.removeConstraint(dragConstraint);
    constraints.splice(constraints.indexOf(dragConstraint), 1);
  }
  if (targetBody) world.removeBody(targetBody);
  selectedBody = null;
  targetBody = null;
  dragConstraint = null;
  dragPlane = null;
}
init();
animate();</script>
